# dsh-login bundle patch: insert the plugin and take over the web runtime.
#
# Applied as a bundle layer when installed via
#   dsh plugin --profile web add github:islibaodong/dsh-login
# (this file is declared in package.json's dsh.bundle.patch).
#
# Password: no pre-configuration needed. On first visit the /login page
# shows a "Set Password" form; the password is stored automatically in
# the DSH credentials system (credential ref DSH_LOGIN_PASSWORD).
#
# IMPORTANT: dsh-login claims the webserver fallback seat (the single
# seat for everything no named route claims). The dsh-web-app bundle's
# `web-runtime` row mounts the frontend-static fallback owner, so that
# row is disabled here; dsh-login re-provides the webRuntime service
# (LAN trust for the /api fence + DSH_WEB_URL) and serves the dist
# itself through the authenticated gateway.

- insert:
    - id: dsh-login
      name: '@deepseek-ai/dsh-login'
      config:
        password: DSH_LOGIN_PASSWORD
        # distIndex: '' resolves @deepseek-ai/dsh-web-frontend/dist automatically.
        # trustedHosts defaults to []; if you launch with --trusted-host, add
        # the same authorities here (a config row cannot read ctx.webStartup
        # without declaring inject, so this patch pins no expression).
        sessionTtl: 604800
        takeOverWebRuntime: true
        enabled: true

# The web-runtime row's fallback claim conflicts with dsh-login's gateway;
# dsh-login re-provides webRuntime, so disabling it is safe.
- id: web-runtime
  disabled: true
