name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.9.0', '24.x']
    steps:
      - name: Checkout dsh-login
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: npm

      # Use the released DSH dependencies pinned in package-lock.json.
      # The Vitest suite includes real HTTP and full-plugin integration tests.
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit and integration tests
        run: npm test

      - name: Run legacy unit smoke tests
        run: node --import tsx/esm tests/runner.mjs

      - name: Verify source imports
        run: npm run verify:imports

      - name: Build plugin bundles
        run: npm run build

      - name: Verify committed bundles are current
        run: git diff --exit-code -- dist/
